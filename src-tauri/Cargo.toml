[package]
name = "miniubrowser"
version = "1.0.0"
description = "MiniUBrowser - Xiaoyuzhou audio extractor"
authors = ["corey"]
edition = "2021"

[lib]
name = "miniubrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
# Follow-up tasks: rusqlite, tokio, etc. for Cosmos DB / FFmpeg ports
# rusqlite = { version = "0.32", features = ["bundled"] }
